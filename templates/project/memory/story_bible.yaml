# ============================================================
# 故事圣经 - 全局世界观和写作规则（新建项目从这里开始填）
# ============================================================

# 【必填】故事标题
title: "你的故事标题"

# 题材 / 基调
genre: "现实 / 悬疑 / 情感 ..."
tone: "冷静、克制 ..."

# 叙事控制·书级默认（可选）。生成时可在「章节工作台」按章覆盖。
narrative_defaults:
  pov: "limited:主角名"
  directives:
    - "Forensic Minimalism"
    - "Diegetic Observation only (no authorial summary of feelings)"

# 【必填】世界观规则（3-10 条，写清时间地点社会规则，模型会严格遵守）
world_rules:
  - "示例：故事发生在中国一个小县城，时间是二十世纪九十年代末。"
  - "示例：主角是一个普通打工人，没有金手指，靠自己的选择推进剧情。"

# 写作规则（中英文都行；形式/叙事规则建议用英文更贴合模型）
writing_rules:
  - "示例：对白克制，潜台词优先于直白抒情。"

# 导演级电影化写作规则（可选，写手会参考）
cinematic_rules:
  - "示例：每章有一个可'拍下来'的视觉主句。"
  - "示例：场景切换用画面变化连接，不用'此时'等过渡词。"
